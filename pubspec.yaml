name: alili_omni
description: Alili Omni - Ultimate AI
publish_to: 'none'
version: 12.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  http: ^1.2.2
  shared_preferences: ^2.2.3
  image_picker: ^1.0.7
  file_picker: ^8.0.6
  flutter_markdown_plus: ^1.0.0+1   # الإصدار المتوافق مع Flutter 3.24
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#0F0F0F"
  image: assets/icon/app_icon.png
  android_12:
    color: "#0F0F0F"
    image: assets/icon/app_icon.png
