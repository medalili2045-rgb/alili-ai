<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Alili AI Pro</title>
    
    <style>
        :root { --bg: #0a0a0f; --card: #151520; --primary: #8a2be2; --accent: #00ffcc; --text: #fff; --text-dim: #888; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        /* شاشة تسجيل الدخول */
        #loginScreen { position: fixed; inset: 0; background: var(--bg); z-index: 2000; display: flex; justify-content: center; align-items: center; flex-direction: column; padding: 20px; }
        .login-card { background: var(--card); padding: 30px; border-radius: 20px; text-align: center; width: 100%; max-width: 400px; border: 1px solid rgba(255,255,255,0.1); }
        .google-btn { background: #fff; color: #000; border: none; padding: 15px; border-radius: 10px; font-weight: bold; width: 100%; margin-top: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 1rem; }
        .google-btn img { width: 20px; }

        /* التطبيق */
        #appScreen { display: none; flex-direction: column; height: 100vh; }
        main { flex: 1; overflow-y: auto; padding: 15px; padding-bottom: 90px; }
        
        .card { background: var(--card); border-radius: 16px; padding: 15px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.05); }
        .card-title { font-size: 1rem; font-weight: bold; margin-bottom: 10px; color: var(--accent); }
        
        .user-header { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; background: var(--card); padding: 15px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.05); }
        .user-header img { width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--accent); }
        
        input[type="text"], input[type="password"] { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: #000; color: #fff; margin-bottom: 10px; }
        .btn { background: linear-gradient(135deg, var(--primary), #ff0077); color: #fff; border: none; padding: 12px; border-radius: 10px; font-weight: bold; width: 100%; margin-top: 5px; cursor: pointer; }
        
        input[type="file"] { display: none; }
        .upload-label { display: block; border: 2px dashed rgba(255,255,255,0.2); padding: 20px; border-radius: 12px; text-align: center; cursor: pointer; margin-bottom: 10px; color: var(--text-dim); }
        
        .result-img { width: 100%; border-radius: 12px; margin-top: 10px; display: none; }
        .log { background: #000; color: var(--accent); font-family: monospace; font-size: 0.8rem; padding: 10px; border-radius: 8px; height: 80px; overflow-y: auto; margin-top: 10px; }
        
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: rgba(10,10,15,0.95); backdrop-filter: blur(10px); display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid rgba(255,255,255,0.1); }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-dim); font-size: 0.75rem; cursor: pointer; }
        .nav-item.active { color: var(--accent); }
        .nav-item svg { width: 22px; height: 22px; margin-bottom: 4px; fill: currentColor; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .ai-tools-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .ai-tool-btn { background: #222; color: #fff; border: 1px solid rgba(255,255,255,0.1); padding: 12px; border-radius: 10px; text-align: center; cursor: pointer; font-size: 0.85rem; }
        .ai-tool-btn.active { border-color: var(--accent); background: rgba(0,255,204,0.1); color: var(--accent); }
    </style>
</head>
<body>

<!-- 1. شاشة تسجيل الدخول -->
<div id="loginScreen">
    <div class="login-card">
        <h1 style="color:var(--accent); margin-bottom:10px;">Alili AI</h1>
        <p style="color:var(--text-dim); margin-bottom:20px;">مرحباً بك! يرجى تسجيل الدخول للمتابعة.</p>
        <button class="google-btn" id="googleLoginBtn">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
            تسجيل الدخول باستخدام Google
        </button>
        <div class="log" id="loginLog" style="margin-top:20px; display:none; text-align:left;">> جاري الاتصال...</div>
    </div>
</div>

<!-- 2. واجهة التطبيق -->
<div id="appScreen">
    <main>
        <!-- التبويب 1: الملف الشخصي -->
        <div id="tab-profile" class="tab-content active">
            <div class="user-header">
                <img id="userAvatar" src="" alt="Avatar">
                <div>
                    <h3 id="userName" style="margin:0;">مستخدم</h3>
                    <p id="userEmail" style="color:var(--text-dim); font-size:0.8rem; margin:0;">...</p>
                </div>
            </div>
            <button class="btn" id="logoutBtn" style="background:#ff3333;">تسجيل الخروج</button>
            <div class="card" style="margin-top:15px;">
                <div class="card-title">⚙️ إعدادات الحساب</div>
                <p style="color:var(--text-dim); font-size:0.9rem;">أنت الآن متصل بالسحابة. سيتم حفظ صورك وإعداداتك قريباً.</p>
            </div>
        </div>

        <!-- التبويب 2: مختبر الذكاء الاصطناعي -->
        <div id="tab-ai" class="tab-content">
            <div class="card">
                <div class="card-title">🔑 مفتاح Hugging Face</div>
                <input type="password" id="hfToken" placeholder="hf_xxxxxxxxxxxxxxxxxxxxx">
                
                <div class="card-title" style="margin-top:15px;">🛠️ اختر المحرك:</div>
                <div class="ai-tools-grid">
                    <div class="ai-tool-btn active" onclick="selectAITool('upscale', this)">✨ تحسين الجودة</div>
                    <div class="ai-tool-btn" onclick="selectAITool('describe', this)">👁️ وصف الصورة</div>
                </div>

                <label class="upload-label">📸 اختر صورة للبدء<input type="file" id="aiImageInput" accept="image/*"></label>
                <button class="btn" id="runAIBtn" disabled>تشغيل المحرك 🚀</button>
                <img id="aiResultImg" class="result-img">
                <div class="log" id="aiLog">> جاهز...</div>
            </div>
        </div>
    </main>

    <!-- شريط التنقل -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('profile', this)">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            حسابي
        </div>
        <div class="nav-item" onclick="switchTab('ai', this)">
            <svg viewBox="0 0 24 24"><path d="M21 10.12h-6.78l2.74-2.82c-2.73-2.7-7.15-2.8-9.88-.1-2.73 2.71-2.73 7.08 0 9.79 2.73 2.71 7.15 2.71 9.88 0 1.36-1.35 2.05-3.13 2.05-4.87h2c0 2.24-.88 4.51-2.64 6.26-3.52 3.48-9.21 3.48-12.73 0-3.52-3.48-3.52-9.11 0-12.59 3.52-3.48 9.21-3.48 12.73 0l2.85-2.85V10.12z"/></svg>
            الذكاء
        </div>
    </div>
</div>

<!-- سكربتات Firebase والذكاء الاصطناعي -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // مفاتيح Firebase الخاصة بمشروعك
    const firebaseConfig = {
        apiKey: "AIzaSyCQgmnWFDYqMv4H4Wn3UNq04uNbZ1NBtLc",
        authDomain: "alili-ai-app.firebaseapp.com",
        projectId: "alili-ai-app",
        storageBucket: "alili-ai-app.firebasestorage.app",
        messagingSenderId: "460687437756",
        appId: "1:460687437756:web:d9b0d827a00b6fda16c5b9",
        measurementId: "G-83DTW2HK6S"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    const loginScreen = document.getElementById('loginScreen');
    const appScreen = document.getElementById('appScreen');
    const loginBtn = document.getElementById('googleLoginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const loginLog = document.getElementById('loginLog');

    // تسجيل الدخول
    loginBtn.addEventListener('click', () => {
        loginLog.style.display = 'block';
        loginLog.textContent = '> جاري فتح نافذة جوجل...';
        signInWithPopup(auth, provider)
            .then((result) => {
                loginLog.style.display = 'none';
            })
            .catch((error) => {
                loginLog.textContent = '> ❌ خطأ: ' + error.message;
            });
    });

    // تسجيل الخروج
    logoutBtn.addEventListener('click', () => {
        signOut(auth);
    });

    // مراقبة حالة الدخول
    onAuthStateChanged(auth, (user) => {
        if (user) {
            loginScreen.style.display = 'none';
            appScreen.style.display = 'flex';
            document.getElementById('userName').textContent = user.displayName || 'مستخدم';
            document.getElementById('userEmail').textContent = user.email;
            document.getElementById('userAvatar').src = user.photoURL || 'https://www.gstatic.com/images/branding/product/1x/avatar_circle_blue_512dp.png';
        } else {
            loginScreen.style.display = 'flex';
            appScreen.style.display = 'none';
        }
    });

    // التنقل بين التبويبات
    window.switchTab = function(tabId, navElement) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        document.getElementById('tab-' + tabId).classList.add('active');
        if(navElement) navElement.classList.add('active');
    };

    // ====== مختبر الذكاء الاصطناعي ======
    let aiImageFile = null;
    let currentAITool = 'upscale';

    document.getElementById('aiImageInput').addEventListener('change', (e) => {
        aiImageFile = e.target.files[0];
        if(aiImageFile) {
            document.getElementById('runAIBtn').disabled = false;
            document.getElementById('aiLog').textContent = '> ✅ تم اختيار الصورة.';
        }
    });

    window.selectAITool = function(tool, btn) {
        currentAITool = tool;
        document.querySelectorAll('.ai-tool-btn').forEach(b => b.classList.remove('active'));
        if(btn) btn.classList.add('active');
    };

    document.getElementById('runAIBtn').addEventListener('click', async () => {
        const token = document.getElementById('hfToken').value.trim();
        const log = document.getElementById('aiLog');
        const btn = document.getElementById('runAIBtn');
        const resultImg = document.getElementById('aiResultImg');

        if(!token || !aiImageFile) {
            log.textContent = '> ⚠️ يرجى إدخال المفتاح واختيار صورة.';
            return;
        }

        btn.disabled = true;
        resultImg.style.display = 'none';
        log.textContent = '> 🧠 جاري الاتصال بالسحابة...';

        let modelUrl = "";
        if(currentAITool === 'upscale') modelUrl = "https://api-inference.huggingface.co/models/ai-forever/Real-ESRGAN";
        else if(currentAITool === 'describe') modelUrl = "https://api-inference.huggingface.co/models/Salesforce/blip-image-captioning-base";

        try {
            const response = await fetch(modelUrl, {
                headers: { 
                    "Authorization": `Bearer ${token}`,
                    "Content-Type": "application/octet-stream" 
                },
                method: "POST",
                body: aiImageFile
            });

            if(!response.ok) throw new Error('فشل الاتصال. قد تحتاج للموافقة على شروط النموذج في Hugging Face.');

            if(currentAITool === 'describe') {
                const data = await response.json();
                log.innerHTML = '> 📝 وصف الصورة: <br><span style="color:#fff;">' + data[0].generated_text + '</span>';
            } else {
                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                resultImg.src = url;
                resultImg.style.display = 'block';
                log.innerHTML = '> ✅ تمت المعالجة! <a href="'+url+'" download="Alili_AI.png" style="color:#00ffcc;">حفظ</a>';
            }

        } catch (err) {
            log.textContent = '> ❌ خطأ: ' + err.message;
        } finally {
            btn.disabled = false;
        }
    });
</script>
</body>
</html>
