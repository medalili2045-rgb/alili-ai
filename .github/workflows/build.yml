name: Build Alili Omni
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'

      - name: Fix Android and Permissions
        run: |
          flutter create . --platforms=android --project-name alili_omni --org com.alili
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="alili_omni"/android:label="Alili Omni"/' android/app/src/main/AndroidManifest.xml
          flutter pub get
          flutter clean

      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v4.0.${{ github.run_number }}
          name: Alili Omni v4.0.${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
