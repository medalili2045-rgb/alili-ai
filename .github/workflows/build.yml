name: Build Alili Omni
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: 'stable'
      - name: Setup Android, Permissions & Kotlin Version
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name alili_omni --org com.alili --template=app
          
          # إضافة الصلاحيات وتغيير الاسم
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"\/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"\/>\n    <application/' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="alili_omni"/android:label="Alili Omni"/' android/app/src/main/AndroidManifest.xml
          
          # تحديث إصدار Kotlin و AGP
          sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "2.0.20"/' android/build.gradle
          sed -i 's/version "7.3.0"/version "8.2.2"/' android/settings.gradle
          
          flutter pub get
          flutter clean
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
      - name: Build APK
        run: flutter build apk --release
      - name: Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v12.0.${{ github.run_number }}
          name: Alili Omni v12.0.${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
